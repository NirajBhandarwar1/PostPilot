[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postpilot"
version = "0.1.0"
description = "An always-on agent that scouts viral AI trends and turns them into build plans and LinkedIn posts, over email."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
postpilot = "postpilot.__main__:main"

[tool.setuptools.packages.find]
include = ["postpilot*"]

[tool.setuptools.package-data]
"postpilot.vendor" = ["*.json", "LICENSE-*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["postpilot/vendor", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["E501", "SIM108", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117", "F811"]  # F811: pytest fixtures imported by name

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["postpilot/vendor/", "experiments/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["postpilot"]
omit = ["postpilot/vendor/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
